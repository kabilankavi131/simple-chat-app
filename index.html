<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kabilan Chat Room</title>
    <link rel="stylesheet" href="./CSS/style.css">
</head>

<body>



    <div id="mainContent">


        <div class="chat-header">
            <div class="group-image">
                <img src="./Images/group-logo.png" alt="Group Icon" />
            </div>
            <div class="group-info">
                <h1 class="group-name">Tech Buddies</h1>
                <p class="member-count"><span class="online-indication"></span><span id="connectionStatus">Connecting…</span> · <span id="userCounts">1</span> members
                </p>
            </div>
            <div class="usernames">
                <span id="fetchUsersNames">You</span><span id="moreUsers" class="more"></span>
            </div>
            <div class="header-actions">
                <button id="theme-toggle" class="action-btn" type="button" aria-label="Switch to dark theme" title="Switch theme">
                    <span aria-hidden="true">☾</span>
                </button>
                <button class="action-btn" aria-label="More chat options">•••</button>
            </div>
        </div>


        <div id="chat-box">
            <div class="chat-welcome" id="chatWelcome">
                <div class="welcome-orb">✦</div>
                <strong>Welcome to Tech Buddies</strong>
                <span>Say hello and start the conversation.</span>
            </div>
        </div>
        <div id="input-box">
            <button id="emoji-toggle" class="utility-btn" type="button" aria-label="Add an emoji">☺</button>
            <div class="emoji-picker" id="emoji-picker" hidden>
                <button type="button" aria-label="Smile">😊</button>
                <button type="button" aria-label="Thumbs up">👍</button>
                <button type="button" aria-label="Celebrate">🎉</button>
                <button type="button" aria-label="Heart">💜</button>
                <button type="button" aria-label="Rocket">🚀</button>
            </div>
            <input type="text" id="message-input" placeholder="Type a message..." />
            <button id="send-btn" type="button" onclick="sendMessage()">Send <span aria-hidden="true">↗</span></button>
        </div>
    </div>
    <div class="modal" id="nameModal">
        <div class="modal-content">
            <h2>Enter Your Name</h2>
            <input type="text" id="username" class="userName" placeholder="Enter your name" required>
            <button onclick="submitName()">Submit</button>
        </div>
    </div>
    <script src="./JS/script.js">

    </script>
</body>

</html>
